<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Site Unavailable — Delight Digital Designs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green-dark: #2d5a3d;
      --green-mid: #3a7a52;
      --green-light: #e8f0eb;
      --text-primary: #1a1a1a;
      --text-secondary: #555;
      --white: #ffffff;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      color: var(--text-primary);
      background: var(--green-light);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    }

    .card {
      background: var(--white);
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      padding: 48px 32px;
      text-align: center;
      box-shadow: 0 2px 24px rgba(0, 0, 0, 0.08);
    }

    .brand-bar {
      display: inline-block;
      background: var(--green-dark);
      color: var(--white);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 6px 16px;
      border-radius: 4px;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: var(--green-dark);
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .message {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 32px;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
    }

    .divider {
      border: none;
      border-top: 1px solid #ddd;
      margin: 0 auto 28px;
      max-width: 80px;
    }

    .contact {
      font-size: 14px;
      line-height: 1.8;
      color: var(--text-secondary);
    }

    .contact a {
      color: var(--green-mid);
      text-decoration: none;
      font-weight: 500;
    }

    .contact a:hover,
    .contact a:focus {
      text-decoration: underline;
    }

    .tagline {
      margin-top: 28px;
      font-size: 12px;
      color: #999;
      font-style: italic;
    }

    @media (max-width: 480px) {
      .card {
        padding: 36px 24px;
      }
      h1 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand-bar">DELIGHT DIGITAL DESIGNS</div>

    <h1>This Site Is Currently Unavailable</h1>

    <p class="message">
      We apologize for the inconvenience. If you have any questions or need assistance, please don't hesitate to reach out.
    </p>

    <hr class="divider">

    <div class="contact">
      <a href="https://delightdigitaldesigns.com">delightdigitaldesigns.com</a><br>
      <a href="mailto:sturmroisin@gmail.com">sturmroisin@gmail.com</a>
    </div>

    <p class="tagline">Big online presence for small town businesses</p>
  </div>

</body>
</html>
